name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  openapi-lint:
    # This name is the required status check in the main and develop rulesets.
    # Renaming it requires updating those rulesets.
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate api/openapi.yaml
        run: |
          if [ ! -f api/openapi.yaml ]; then
            echo "::notice title=OpenAPI lint::api/openapi.yaml does not exist yet; skipping validation."
            exit 0
          fi
          npx --yes @redocly/cli@2.64.1 lint api/openapi.yaml

  frontend:
    # Not a required check yet. It becomes required after its first green run on develop (S3-28).
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        # Switch to .nvmrc once the backend skeleton pins the Node version (S3-29, ADR-011).
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  docs-links:
    # Not a required check yet. It only reports broken links between repo files.
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check relative links in Markdown files
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  compose:
    # Not a required check. Starts the database from docker-compose.yml to show that the file works (S3-29).
    name: Docker Compose check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the database
        run: |
          cp .env.example .env
          docker compose up -d --wait db

      - name: Connect to the database
        run: docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select version();"'

      - name: Stop the database
        if: always()
        run: docker compose down -v
